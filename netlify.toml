# =============================================================
# TechFix OS — configuração de build/deploy no Netlify
#
# Arquitetura:
#   - Frontend estático (index.html/css/js) publicado em `public/`
#   - Backend Flask via Netlify Function (serverless-wsgi)
#   - Banco de dados: Supabase (PostgreSQL)
#
# =============================================================

[build]
  # Copia a UI estática (raiz do repo) para a pasta publicada.
  command = "mkdir -p public && cp index.html public/ && cp -r css public/ && cp -r js public/"
  publish = "public"

# API -> Netlify Function (Flask via serverless-wsgi)
# A Function fica em netlify/functions/api/api.py e é acessível em
# /.netlify/functions/api/...
# Este rewrite redireciona /api/* para a Function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA: qualquer rota que não exista como arquivo volta para o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
