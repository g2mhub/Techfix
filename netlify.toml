# =============================================================
# TechFix OS — build/deploy no Netlify
#
# Arquitetura:
#   - Frontend estatico (index.html/css/js) publicado em `public/`
#   - API Flask hospedada no Render (https://render.com, plano free)
#   - O Netlify PROXIA `/api/*` para o backend via rewrite (status 200)
# =============================================================

[build]
  command = "mkdir -p public && cp index.html public/ && cp -r css public/ && cp -r js public/"
  publish = "public"

# API -> proxy para o backend no Render.
# IMPORTANTE: troque o dominio abaixo pela URL do seu servico no Render
# (ex.: https://techfix-api.onrender.com).
[[redirects]]
  from = "/api/*"
  to = "https://techfix-api-qddz.onrender.com/api/:splat"
  status = 200

# SPA: qualquer rota que nao exista como arquivo volta para o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
